info:
  name: Scan barcode (lookup product)
  type: http
  seq: 4
http:
  method: GET
  url: '{{base_url}}/inventory/lookup-barcode/{{barcode}}'
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: Set :code to the scanned barcode. Returns 404 if no product matches, so the app can offer 'add new product'.
