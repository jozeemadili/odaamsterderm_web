info:
  name: Barcode labels PDF
  type: http
  seq: 11
http:
  method: POST
  url: '{{base_url}}/inventory/barcode-labels'
  body:
    type: json
    data: |-
      {
        "item_ids": [{{item_id}}],
        "show_product_name": true,
        "show_price": true,
        "copies": 1
      }
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: 'Returns the PDF binary directly (application/pdf) — same 3-up Code128 label sheet as the web portal''s Barcode labels page. Only products with a barcode are included; item_ids belonging to another merchant or without a barcode are silently skipped.'
