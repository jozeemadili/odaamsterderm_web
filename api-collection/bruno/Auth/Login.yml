info:
  name: Login
  type: http
  seq: 3
http:
  method: POST
  url: '{{base_url}}/auth/login'
  body:
    type: json
    data: |-
      {
        "email": "amina@example.com",
        "password": "password123"
      }
  auth:
    type: bearer
    token: ''
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
runtime:
  scripts:
  - type: after-response
    code: if (res?.body?.token) bru.setVar("token", res.body.token);
