info:
  name: Add brand-new product to receipt
  type: http
  seq: 5
http:
  method: POST
  url: '{{base_url}}/stock-receipts/{{receipt_id}}/items'
  body:
    type: json
    data: |-
      {
        "new_product_name": "Cooking Oil 1L",
        "new_product_unit": "bottle",
        "new_product_unit_price": 6500,
        "quantity": 10,
        "unit_cost": 5200
      }
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: Use this shape instead of inventory_item_id when the product doesn't exist yet.
